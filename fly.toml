# CubeScape game server — fly.io config
# Region: fra (close to IL/EU); single machine because Colyseus rooms are
# in-memory — scale vertically or add sticky sessions before adding machines.
app = "cubescape-server"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "2567"

[http_service]
  internal_port = 2567
  force_https = true
  # never scale to zero: that would kill live matches
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 400
    soft_limit = 300

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
