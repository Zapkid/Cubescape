# Render blueprint — game server on the FREE plan.
#
# Free-plan behavior: the service spins down after 15 min without traffic and
# takes ~1 min to wake on the next connection. Active matches are never
# interrupted (WebSocket messages count as traffic). The web client pre-pings
# /health from the landing page and retries the join while the server wakes.
#
# One-time setup: Render dashboard → New → Blueprint → connect the GitHub repo.
# After the first deploy, note the service URL (https://<name>.onrender.com)
# and set NEXT_PUBLIC_SERVER_URL=wss://<name>.onrender.com in
# apps/web/.env.production.
services:
  - type: web
    name: cubescape-server
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
